server:
  port: 8189
spring:
  application:
    name: hw17-spring-jms
  activemq:
    broker-url: tcp://localhost:61616
    user: "myactivemquser"
    password: "myactivemquserpass"
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./database;MODE=PostgreSQL
    username:
    password:
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true