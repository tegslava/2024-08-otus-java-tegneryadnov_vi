<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>List of all clients</title>

    <style type="text/css">
        body {
            padding: 50px;
        }

        .clients, .clients td {
            border: 1px solid lightgray;
            padding: 5px;
            margin-bottom: 10px;
        }

        a {
            display: block;
        }

        input {
            width: 150px;
        }


        select {
            width: 154px;
        }

        button {
            width: 250px;
        }

        .controls-container {
            margin-bottom: 5px;
        }

        .single-button-container {
            margin-left: 158px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

    </style>
</head>
<body>

<h3>Сообщения из топика:</h3>

<table class="messages">
    <thead>
    <tr>
        <th>UUID</th>
        <th>Text</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="messageDto : ${messages}">
        <td th:text="${messageDto.uuid()}">d9ee5bad-84f7-4ef2-ba6f-1f73a64efc7d</td>
        <td th:text="${messageDto.messageText()}">Пушкин жив!</td>
    </tr>
    </tbody>
</table>
<a th:href="@{/api/v1/messages/create}" href="messageCreate.html">Новое сообщение</a>

</body>
</html>
